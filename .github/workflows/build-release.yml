name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macos-intel

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Drift Client ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }}

  build-flatpak:
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - name: Setup Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app (deb first)
        run: pnpm --filter launcher tauri build --bundles deb

      - name: Build Flatpak
        run: |
          mkdir -p build-flatpak
          cp launcher/src-tauri/flatpak/gg.drift.client.json build-flatpak/gg.drift.client.yml
          cp launcher/src-tauri/flatpak/gg.drift.client.desktop build-flatpak/
          cp launcher/src-tauri/flatpak/gg.drift.client.metainfo.xml build-flatpak/
          cp -r launcher/src-tauri/icons build-flatpak/icons
          cp -r launcher/dist build-flatpak/dist
          cp launcher/src-tauri/target/release/drift-launcher build-flatpak/drift-launcher
          flatpak-builder --user --install --force-clean build-dir build-flatpak/gg.drift.client.yml

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle ~/.local/share/flatpak/repo drift-client.flatpak gg.drift.client

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: drift-client.flatpak
