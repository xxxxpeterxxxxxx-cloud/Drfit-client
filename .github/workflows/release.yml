name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-alpha)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Drift Client ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            # Drift Client ${{ github.event.inputs.tag || github.ref_name }}

            ## Install

            ### Linux (DEB)
            ```bash
            curl -L https://github.com/xxxxpeterxxxxxx-cloud/Drfit-client/releases/download/${{ github.event.inputs.tag || github.ref_name }}/Drift.Client_0.1.0_amd64.deb -o drift-client.deb
            sudo dpkg -i drift-client.deb
            drift-client
            ```

            ### Linux (RPM)
            ```bash
            curl -L https://github.com/xxxxpeterxxxxxx-cloud/Drfit-client/releases/download/${{ github.event.inputs.tag || github.ref_name }}/Drift.Client-0.1.0-1.x86_64.rpm -o drift-client.rpm
            sudo rpm -i drift-client.rpm
            drift-client
            ```

            ### Windows
            Download the .exe installer from the assets below.
            If no .exe is attached, build from source:
            ```bash
            git clone https://github.com/xxxxpeterxxxxxx-cloud/Drfit-client.git
            cd Drfit-client/launcher
            npm install
            npm run tauri build
            ```

            ### macOS
            Download the .dmg from the assets below.
            If no .dmg is attached, build from source:
            ```bash
            git clone https://github.com/xxxxpeterxxxxxx-cloud/Drfit-client.git
            cd Drfit-client/launcher
            npm install
            npm run tauri build
            ```

            ## What's New
            - Tauri v2 launcher with React frontend
            - Rust backend: Microsoft auth, Minecraft launch, Fabric install, Modrinth integration
            - 5 Fabric mods: core, hud, qol, perf, legacy (1.8.9)

            ---
            **License:** GPL-3.0 | **Requirements:** Java 21+, Minecraft account
          draft: false
          prerelease: true

  build-launcher:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Install Linux dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
        working-directory: launcher

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Drift Client ${{ github.event.inputs.tag || github.ref_name }}"
          args: --target ${{ matrix.target }}

  build-flatpak:
    needs: build-launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - name: Setup Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - run: pnpm install --frozen-lockfile
        working-directory: launcher

      - name: Build Tauri binary
        run: npx tauri build --no-bundle
        working-directory: launcher

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean build-dir gg.drift.client.json
          flatpak build-bundle ~/.local/share/flatpak/repo Drift.Client_0.1.0_x86_64.flatpak gg.drift.client
        working-directory: flatpak

      - name: Upload Flatpak to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: flatpak/Drift.Client_*_x86_64.flatpak

  build-mods:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build mods
        run: ./gradlew build --no-daemon
        working-directory: mods

      - name: Upload mod JARs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: mods/*/build/libs/*.jar
